[package]
name = "downtrack"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "sync", "rt-multi-thread", "macros"] }
thiserror = "2"
walkdir = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
